<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--color-white);color:var(--text-body)}.row{display:flex;gap:0}.sw{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:10px;line-height:1.35}.sw b{font-weight:600;display:block}.sw span{opacity:.75;font-variant-numeric:tabular-nums}</style></head><body><div class="row"><div class="sw" style="background:#ffffff;color:#000a08"><b>white</b><span>#ffffff</span></div><div class="sw" style="background:#f2f2f2;color:#000a08"><b>lightest</b><span>#f2f2f2</span></div><div class="sw" style="background:#d8dad9;color:#000a08"><b>lighter</b><span>#d8dad9</span></div><div class="sw" style="background:#b2b5b4;color:#000a08"><b>light</b><span>#b2b5b4</span></div><div class="sw" style="background:#7f8483;color:#ffffff"><b>neutral</b><span>#7f8483</span></div><div class="sw" style="background:#4c5352;color:#ffffff"><b>dark</b><span>#4c5352</span></div><div class="sw" style="background:#192220;color:#ffffff"><b>darker</b><span>#192220</span></div><div class="sw" style="background:#000a08;color:#ffffff"><b>darkest</b><span>#000a08</span></div></div></body></html>
