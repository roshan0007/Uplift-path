<!-- @dsCard group="Brand" viewport="700x170" name="Press shadows" subtitle="Hard 3px ledges, zero blur. Hover translates the control down onto its ledge." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;font-family:var(--font-body);background:var(--color-white);color:var(--text-body)}.row{display:flex;gap:0}.sw{flex:1;height:74px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:10px;line-height:1.35}.sw b{font-weight:600;display:block}.sw span{opacity:.75;font-variant-numeric:tabular-nums}</style></head><body><div style="display:flex;gap:26px;align-items:flex-start;font-size:11px;color:var(--text-muted)">
<div><div style="width:150px;height:44px;border:2px solid var(--color-caribbean-green-dark);background:var(--color-caribbean-green);border-radius:var(--radius-button);box-shadow:0 3px 0 0 var(--color-caribbean-green-dark)"></div><div style="margin-top:9px">--shadow-press-accent</div></div>
<div><div style="width:150px;height:44px;border:2px solid var(--color-neutral-darkest);border-radius:var(--radius-button);box-shadow:0 3px 0 0 var(--color-neutral-darkest)"></div><div style="margin-top:9px">--shadow-press-dark</div></div>
<div><div style="width:150px;height:44px;border:2px solid var(--color-neutral-lighter);border-radius:var(--radius-button);box-shadow:0 3px 0 0 var(--color-neutral-lighter)"></div><div style="margin-top:9px">--shadow-press-light</div></div>
<div><div style="width:150px;height:44px;border:2px solid var(--color-neutral-darkest);background:var(--color-caribbean-green);border-radius:var(--radius-button);transform:translateY(3px)"></div><div style="margin-top:9px">hover / pressed — no ledge</div></div>
</div></body></html>
